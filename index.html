<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no,
                 viewport-fit=cover">
  <meta name="theme-color" content="#061d35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EMP PRO">
  <title>EMP PRO</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    html,body{
      margin:0;padding:0;width:100%;height:100%;
      overflow:hidden;background:#061d35;
    }
    #emp-pro{
      position:fixed;inset:0;width:100%;height:100%;
      border:0;margin:0;padding:0;display:block;background:#061d35;
    }

    #emp-diag{
      position:fixed;
      left:8px;
      bottom:8px;
      z-index:999999;
      max-width:calc(100% - 16px);
      box-sizing:border-box;
      padding:7px 10px;
      border-radius:9px;
      background:rgba(0,0,0,.82);
      color:#fff;
      font:12px/1.25 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      white-space:normal;
      pointer-events:none;
    }
  </style>
</head>
<body>

  <div id="emp-diag">DIAG: iniciant…</div>

  <iframe
    id="emp-pro"
    src="https://script.google.com/macros/s/AKfycbwfnxgfveMbk55-jIK45fKK18W0yU2aiNG18md1UStHsVPh_i8-Gh9twTsQyXxEQHn2/exec"
    allow="fullscreen"
    scrolling="yes">
  </iframe>

  <script>
  (function(){
    'use strict';

    var CLAU='EMP_PRO_ID_USUARI';
    var COOKIE='EMP_PRO_ID_USUARI';
    var frame=document.getElementById('emp-pro');
    var diag=document.getElementById('emp-diag');

    function mostrarDiag(text){
      if(diag) diag.textContent='DIAG GitHub: '+text;
    }


    function idValid(id){
      return /^USR_[A-Za-z0-9_-]+$/.test(String(id||'').trim());
    }

    function llegirId(){
      var id='';

      try{
        id=String(localStorage.getItem(CLAU)||'').trim();
        if(idValid(id)){ mostrarDiag('ID = '+id+' (localStorage)'); return id; }
      }catch(e){}

      try{
        var parts=(document.cookie||'').split(';');
        for(var i=0;i<parts.length;i++){
          var p=parts[i].trim();
          if(p.indexOf(COOKIE+'=')===0){
            id=decodeURIComponent(p.substring(COOKIE.length+1));
            if(idValid(id)){ mostrarDiag('ID = '+id+' (cookie)'); return id; }
          }
        }
      }catch(e){}

      mostrarDiag('ID = CAP');
      return '';
    }

    function guardarId(id){
      id=String(id||'').trim();
      if(!idValid(id)) return false;

      var ok=false;

      try{
        localStorage.setItem(CLAU,id);
        ok=(localStorage.getItem(CLAU)===id);
      }catch(e){}

      try{
        document.cookie=
          COOKIE+'='+encodeURIComponent(id)+
          '; Max-Age=31536000; Path=/; SameSite=Lax';
      }catch(e){}

      var finalOk=ok || llegirId()===id;
      mostrarDiag(finalOk ? 'GUARDAT '+id : 'ERROR guardant '+id);
      return finalOk;
    }

    function enviarId(){
      var id=llegirId();
      if(!id || !frame || !frame.contentWindow) return;
      try{
        mostrarDiag('ENVIANT '+id+' a Apps Script');
        frame.contentWindow.postMessage({
          tipus:'EMP_USR_ID',
          idUsuari:id
        },'*');
      }catch(e){
        mostrarDiag('ERROR enviant ID');
      }
    }

    window.addEventListener('message',function(e){
      if(!frame || e.source!==frame.contentWindow) return;

      var d=e.data||{};

      if(d.tipus==='EMP_USR_SET_ID' && idValid(d.idUsuari)){
        /*
         * V13: guardem l'ID però NO el reenviem immediatament.
         * Durant registre -> favorits, l'eco provocava una segona
         * validació concurrent que interferia amb carregarCataleg().
         */
        guardarId(d.idUsuari);
        mostrarDiag('REBUT i GUARDAT '+d.idUsuari);
        return;
      }

      if(d.tipus==='EMP_USR_GET_ID'){
        enviarId();
      }
    });

    var idInicial=llegirId();
    mostrarDiag(idInicial ? 'INICI ID = '+idInicial : 'INICI ID = CAP');

        frame.addEventListener('load',function(){
      enviarId();
      setTimeout(enviarId,250);
      setTimeout(enviarId,1000);
    });

    window.addEventListener('pageshow',function(){
      enviarId();
    });

    document.addEventListener('visibilitychange',function(){
      if(!document.hidden) enviarId();
    });
  })();
  </script>

</body>
</html>
