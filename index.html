<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no,
                 viewport-fit=cover">
  <meta name="theme-color" content="#061d35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EMP PRO">
  <title>EMP PRO</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    html,body{
      margin:0;padding:0;width:100%;height:100%;
      overflow:hidden;background:#061d35;
    }
    #emp-pro{
      position:fixed;inset:0;width:100%;height:100%;
      border:0;margin:0;padding:0;display:block;background:#061d35;
    }
  </style>
</head>
<body>

  <iframe
    id="emp-pro"
    src="https://script.google.com/macros/s/AKfycbwfnxgfveMbk55-jIK45fKK18W0yU2aiNG18md1UStHsVPh_i8-Gh9twTsQyXxEQHn2/exec"
    allow="fullscreen"
    scrolling="yes">
  </iframe>

  <script>
  (function(){
    'use strict';

    var CLAU='EMP_PRO_ID_USUARI';
    var EXEC='https://script.google.com/macros/s/AKfycbwfnxgfveMbk55-jIK45fKK18W0yU2aiNG18md1UStHsVPh_i8-Gh9twTsQyXxEQHn2/exec';
    var frame=document.getElementById('emp-pro');

    function idValid(id){
      return /^USR_[A-Za-z0-9_-]+$/.test(String(id||'').trim());
    }

    function idDeUrl(){
      try{
        var q=new URLSearchParams(window.location.search||'');
        var id=String(q.get('emp_uid')||'').trim();
        return idValid(id) ? id : '';
      }catch(e){
        return '';
      }
    }

    function idDeLocal(){
      try{
        var id=String(localStorage.getItem(CLAU)||'').trim();
        if(idValid(id)) return id;
      }catch(e){}

      try{
        var parts=(document.cookie||'').split(';');
        for(var i=0;i<parts.length;i++){
          var p=parts[i].trim();
          if(p.indexOf(CLAU+'=')===0){
            var id=decodeURIComponent(p.substring(CLAU.length+1));
            if(idValid(id)) return id;
          }
        }
      }catch(e){}

      return '';
    }

    function escriureUrl(id){
      if(!idValid(id)) return;
      try{
        var u=new URL(window.location.href);
        u.searchParams.set('emp_uid',id);
        history.replaceState(null,'',u.pathname+u.search+u.hash);
      }catch(e){}
    }

    function guardarId(id){
      id=String(id||'').trim();
      if(!idValid(id)) return;

      try{ localStorage.setItem(CLAU,id); }catch(e){}

      try{
        document.cookie=
          CLAU+'='+encodeURIComponent(id)+
          '; Max-Age=31536000; Path=/; SameSite=Lax';
      }catch(e){}

      /*
       * Tercer canal: l'ID queda també a la URL de la PWA.
       */
      escriureUrl(id);
    }

    function urlIframe(id){
      return idValid(id)
        ? EXEC+'?emp_uid='+encodeURIComponent(id)
        : EXEC;
    }

    function enviarId(id){
      id=String(id||'').trim();
      if(!idValid(id) || !frame || !frame.contentWindow) return;

      try{
        frame.contentWindow.postMessage({
          tipus:'EMP_USR_ID',
          idUsuari:id
        },'*');
      }catch(e){}
    }

    /*
     * ARRANCADA:
     * 1 URL de la PWA
     * 2 localStorage/cookie
     * 3 anònim
     */
    var idInicial=idDeUrl() || idDeLocal();

    if(idInicial){
      guardarId(idInicial);
      frame.src=urlIframe(idInicial);
    }

    window.addEventListener('message',function(e){
      if(!frame || e.source!==frame.contentWindow) return;

      var d=e.data||{};

      if(d.tipus==='EMP_USR_SET_ID' && idValid(d.idUsuari)){
        guardarId(d.idUsuari);
        return;
      }

      if(d.tipus==='EMP_USR_GET_ID'){
        var id=idDeUrl() || idDeLocal();
        if(id) enviarId(id);
      }
    });

    frame.addEventListener('load',function(){
      var id=idDeUrl() || idDeLocal();
      if(id) enviarId(id);
    });

    window.addEventListener('pageshow',function(){
      var id=idDeUrl() || idDeLocal();
      if(id) enviarId(id);
    });

    document.addEventListener('visibilitychange',function(){
      if(document.hidden) return;
      var id=idDeUrl() || idDeLocal();
      if(id) enviarId(id);
    });
  })();
  </script>

</body>
</html>
