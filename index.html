<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#061d35">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Els meus partits">

  <title>Els meus partits</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon"
        type="image/png"
        sizes="192x192"
        href="./icon-192.png">

  <script>
    const EMP_URL =
      'https://script.google.com/macros/s/AKfycbwfnxgfveMbk55-jIK45fKK18W0yU2aiNG18md1UStHsVPh_i8-Gh9twTsQyXxEQHn2/exec';

    const instalada =
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    // Només entra automàticament a EMP PRO
    // quan s'obre des de la icona de l'iPhone.
    if (instalada) {
      window.location.replace(EMP_URL);
    }
  </script>
</head>

<body style="
  margin:0;
  background:#061d35;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
">

  <main style="
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
    box-sizing:border-box;
    text-align:center;
  ">

    <div>

      <img
        src="./icon-512.png"
        alt="Els meus partits"
        style="
          width:150px;
          height:150px;
          border-radius:32px;
          margin-bottom:24px;
        "
      >

      <h1 style="margin:0 0 12px;">
        Els meus partits
      </h1>

      <p style="
        margin:0 0 28px;
        opacity:.8;
        line-height:1.5;
      ">
        Afegeix aquesta aplicació a la pantalla d'inici
        del teu iPhone.
      </p>

      <a
        href="https://script.google.com/macros/s/AKfycbwfnxgfveMbk55-jIK45fKK18W0yU2aiNG18md1UStHsVPh_i8-Gh9twTsQyXxEQHn2/exec"
        style="
          display:inline-block;
          background:white;
          color:#061d35;
          text-decoration:none;
          font-weight:700;
          padding:15px 25px;
          border-radius:14px;
        "
      >
        Obrir Els meus partits
      </a>

    </div>

  </main>

</body>
</html>
